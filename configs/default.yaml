# AIPA-CRS configuration
# RUN_MODE is selected in the notebook (or via AIPA_RUN_MODE env var); the
# matching block below is merged over `common`.

common:
  dataset_name: ReDial
  dataset_source: "https://github.com/ReDialData/website/raw/data/redial_dataset.zip"
  dataset_path: data/raw/redial
  processed_path: data/processed
  interim_path: data/interim
  external_path: data/external
  output_path: outputs
  # "tfidf-svd" is a lightweight word n-gram TF-IDF + SVD encoder that runs on CPU
  # in seconds.  Any sentence-transformers model id (e.g. all-MiniLM-L6-v2) can be
  # used instead when the weights are available offline.
  embedding_model: tfidf-svd
  text_dim: 128
  hidden_dim: 64
  learning_rate: 0.003
  weight_decay: 0.00001
  batch_size: 256
  epochs: 5
  seed: 42
  seeds: [42]
  top_k: [10, 20]
  alpha: 0.5
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  relationship_threshold: 0.5
  clarification_threshold: 0.6
  device: auto
  max_history: 50
  max_context_turns: 6
  history_temporal_decay: 0.9
  # synthetic controlled conflict injection
  injection_rate: 0.15
  injection_intensities: [1, 2, 3]
  bootstrap_samples: 500
  min_history_for_ltp: 3
  # counterfactual driver diagnostic: top-K disagreement threshold for a driver
  cf_tau: 0.1
  cf_dominance: 1.5   # a signal is the sole driver when its top-K disruption is >= dominance x the other signal's
  # temporal persistence: sessions with the same STI-prioritised genre before an
  # override is treated as a persistent preference shift
  persistence_k: 2
  persistence_gain: 0.3
  lambda_rel: 0.5
  lambda_act: 0.3
  # arbitration: learn the per-action (w_ltp, w_sti) mixing weights (softmax over
  # 2 logits per action, initialised to the fixed 0.5/0.5, 0.85/0.15, ... table) and
  # optionally let the policy add an instance-level residual to the fused alpha.
  # Set both to false for the fixed-table behaviour.  (residual_gate lowered
  # validation relationship macro-F1 by ~0.08 in quick mode, so it stays off.)
  learned_action_weights: true
  residual_gate: false
  # recommendation loss: softmax | sampled_softmax | bpr (in-batch + n_negatives uniform negatives)
  rec_loss: softmax
  n_negatives: 256
  # >1 up-weights the recommendation loss on Conflict/Override training instances
  # (natural weak-rule or synthetic); 1.0 = off
  conflict_loss_weight: 1.0
  rel_label_smoothing: 0.0
  # confidence-filtered self-training of the relationship head (off by default):
  # from self_train_start_epoch on, weak-rule labels with confidence < self_train_min_conf
  # are replaced by the model's prediction when its max-probability >= self_train_threshold
  self_train: false
  self_train_start_epoch: 3
  self_train_min_conf: 0.6
  self_train_threshold: 0.9
  # relationships with controlled synthetic injections (drop Complement/Uncertain for
  # the original three-class injection)
  injection_relationships: [Conflict, Override, Consistent, Complement, Uncertain]
  n_case_studies: 12
  num_workers: 0

quick:
  subset_fraction: 0.25
  epochs: 15
  hidden_dim: 64
  text_dim: 64
  seeds: [42, 7]
  bootstrap_samples: 200
  batch_size: 128
  # same validation-selected training settings as `full` (see there); rec_loss stays softmax
  lambda_rel: 1.0
  lambda_act: 0.6
  conflict_loss_weight: 2.0
  rel_label_smoothing: 0.1
  self_train: true

full:
  subset_fraction: 1.0
  epochs: 20
  hidden_dim: 64
  text_dim: 128
  seeds: [42, 7, 123]
  bootstrap_samples: 1000
  batch_size: 256
  # Selected on the VALIDATION split only (quick mode, seeds 42+7, AIPA (full)) with
  # scripts/tune_lambdas.py; selection metric: natural validation Hit@10, with the
  # weak-rule validation relationship macro-F1 / conflict-subset Hit@10 reported
  # alongside (sweep CSVs: outputs/results/validation_sweep_*.csv).  The test split
  # was never used.
  #   rec_loss: softmax 0.123 > sampled_softmax 0.072 > bpr 0.046 (valid Hit@10)
  #   lambda grid {0.5,1.0}x{0.1,0.6}: 1.0/0.6 best valid Hit@10 (0.128; all within 0.002)
  #   conflict_loss_weight 2.0 and rel_label_smoothing 0.1 raised conflict-subset
  #   valid Hit@10 (0.092 -> 0.109..0.121) and Override-F1 at unchanged Hit@10;
  #   self_train raised valid macro-F1 by ~0.01 at unchanged Hit@10.
  rec_loss: softmax
  lambda_rel: 1.0
  lambda_act: 0.6
  conflict_loss_weight: 2.0
  rel_label_smoothing: 0.1
  self_train: true
