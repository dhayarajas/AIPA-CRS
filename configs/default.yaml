# AIPA-CRS configuration
# RUN_MODE is selected in the notebook (or via AIPA_RUN_MODE env var); the
# matching block below is merged over `common`.

common:
  dataset_name: ReDial
  dataset_source: "https://github.com/ReDialData/website/raw/data/redial_dataset.zip"
  dataset_path: data/raw/redial
  processed_path: data/processed
  interim_path: data/interim
  external_path: data/external
  output_path: outputs
  # Text encoder for profile / context / last-utterance strings and item titles.
  #   "tfidf-svd": word n-gram TF-IDF + SVD (`text_dim` components), fitted on the
  #                training split; CPU, seconds, no download.
  #   any sentence-transformers id, e.g. "sentence-transformers/all-MiniLM-L6-v2"
  #                (384-d, ~90 MB, fetched from Hugging Face on first use): pretrained
  #                semantic embeddings; `text_dim` is then ignored and the model's own
  #                dimension is projected to `hidden_dim` inside the LTP/STI/item towers.
  # Override from the CLI with `python -m aipa.pipeline --embedding-model <id>`.
  embedding_model: tfidf-svd
  text_dim: 128
  encoder_batch_size: 128       # sentence-transformers batch size (CPU)
  text_cache: true              # cache embeddings in data/interim/text_cache_<model>_<id-hash>.npz (keyed by sha1 of the text)
  embedding_fallback: true      # fall back to tfidf-svd (and record why) if the pretrained model cannot be loaded
  item_text_genres: true        # item text = "Title (year). Genres: Comedy, Romance" (false: bare ReDial title)
  hidden_dim: 64
  learning_rate: 0.003
  weight_decay: 0.00001
  batch_size: 256
  epochs: 5
  seed: 42
  seeds: [42]
  top_k: [10, 20]
  alpha: 0.5
  alpha_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
  relationship_threshold: 0.5
  clarification_threshold: 0.6
  device: auto
  max_history: 50
  max_context_turns: 6
  history_temporal_decay: 0.9
  # synthetic controlled conflict injection
  injection_rate: 0.15
  injection_intensities: [1, 2, 3]
  bootstrap_samples: 500
  permutation_samples: 2000
  min_history_for_ltp: 3
  # conflict subsets (natural test instances): the strict subset is defined by
  # the weak-rule label alone; the broad "disagreement" subset adds confident
  # weak-rule labels whose LTP and STI genre distributions diverge (Jensen-
  # Shannon divergence, base 2, in [0, 1]).
  conflict_strict_labels: [Conflict, Override]
  disagreement_conf_min: 0.6
  disagreement_js_min: 0.5
  # per-history-length buckets [name, min_items, max_items (null = open)] and
  # number of target genres for the per-genre breakdown
  history_buckets: [[cold, 0, 2], [short, 3, 9], [mid, 10, 24], [long, 25, null]]
  genre_breakdown_top: 8
  # counterfactual driver diagnostic: top-K disagreement threshold for a driver
  cf_tau: 0.1
  cf_dominance: 1.5   # a signal is the sole driver when its top-K disruption is >= dominance x the other signal's
  # temporal persistence: sessions with the same STI-prioritised genre before an
  # override is treated as a persistent preference shift
  persistence_k: 2
  persistence_gain: 0.3
  persistence_k_grid: [1, 2, 3]     # swept on the validation split (report only; test uses persistence_k)
  persistence_min_sessions: 3       # the tracker is evaluated on seekers with >= this many test sessions
  # automatic success criteria (outputs/results/success_criteria.csv)
  criteria_alpha: 0.05
  criteria_macro_f1_min: 0.5
  criteria_conflict_f1_min: 0.5
  criteria_clarification_precision_min: 0.5
  criteria_unnecessary_clarification_max: 0.10
  lambda_rel: 0.5
  lambda_act: 0.3
  # stronger baselines trained on identical inputs (same losses / seeds / epochs).
  # SASRec: causal self-attention over history + in-dialogue liked items.
  sasrec_blocks: 2
  sasrec_heads: 2
  sasrec_dropout: 0.1
  # KBRD-style: pooling of mentioned item / genre entities, "attention" or "mean".
  kbrd_pooling: attention
  # models listed here are skipped by the experiment loop, e.g. [SASRec, KBRD-style]
  # restores the previous baseline set.
  disabled_models: []
  n_case_studies: 12
  num_workers: 0

quick:
  subset_fraction: 0.25
  epochs: 15
  hidden_dim: 64
  text_dim: 64
  # quick mode keeps the download-free encoder; switch to the pretrained one with
  #   embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_model: tfidf-svd
  seeds: [42, 7]
  bootstrap_samples: 200
  batch_size: 128

full:
  subset_fraction: 1.0
  epochs: 20
  hidden_dim: 64
  text_dim: 128                 # only used when embedding_model is tfidf-svd
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  seeds: [42, 7, 123, 2024, 31337]
  bootstrap_samples: 1000
  batch_size: 256
